apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: k2-base-lite
  labels: {app: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: k2-base-lite-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: backend-config}
            - secretRef: {name: backend-secret}
          readinessProbe:
            httpGet: {path: /api/health/, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health/, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: k2-base-lite
spec:
  selector: {app: backend}
  ports:
    - port: 8000
      targetPort: 8000
