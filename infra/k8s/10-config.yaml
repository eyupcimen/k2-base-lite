apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: k2-base-lite
data:
  DEBUG: "0"
  ALLOWED_HOSTS: "*"
---
# Demo only. In production use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: k2-base-lite
type: Opaque
stringData:
  SECRET_KEY: "replace-me"
