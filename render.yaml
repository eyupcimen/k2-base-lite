# Render Blueprint: free-tier deployment of the demo (API + static frontend).
services:
  - type: web
    name: k2-base-lite-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://k2-base-lite.onrender.com"

  - type: web
    name: k2-base-lite
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://k2-base-lite-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
